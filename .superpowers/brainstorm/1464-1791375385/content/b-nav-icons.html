<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  .navs { display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; }
  .navs figure { margin:0; }
  .navs figcaption { font-size:13px; margin-top:8px; opacity:.8; max-width:220px; }
  .rail { width:172px; height:420px; background:#16181A; border:1px solid #2C2F33; border-radius:6px; display:flex; flex-direction:column; padding:14px 0; font-family:'IBM Plex Sans',sans-serif; color:#A9ACB1; }
  .rail .mark { padding:0 16px 18px; font-weight:600; font-size:15px; color:#F2EFE8; }
  .rail .mark span { display:block; font-weight:400; font-size:11.5px; color:#7F8389; margin-top:2px; }
  .rail a { display:flex; align-items:center; gap:10px; padding:9px 16px; font-size:13.5px; border-left:2px solid transparent; }
  .rail a svg { width:17px; height:17px; stroke-width:1.75; flex:none; }
  .rail a .t { margin-left:auto; font-size:11px; font-weight:600; }
  .rail a.on { color:#F2EFE8; background:#212428; border-left-color:#F5B83D; }
  .rail a.on svg { color:#F5B83D; }
  .rail .foot { margin-top:auto; }
  .slim { width:64px; padding:14px 0; }
  .slim .mark { padding:0 0 18px; text-align:center; font-size:13px; }
  .slim a { flex-direction:column; gap:4px; padding:10px 0; font-size:10.5px; border-left:0; border-right:0; position:relative; }
  .slim a.on { background:#212428; box-shadow: inset 2px 0 0 #F5B83D; }
  .slim a .dot { position:absolute; top:7px; right:13px; width:7px; height:7px; border-radius:50%; }
</style>

<h2>Sidebar with the current page icons</h2>
<p class="subtitle">Same lucide icons as the current sidebar (Radio, Flame, Waves, Drone, Map, Moon/Sun), restyled for B. Which width do you prefer?</p>

<div class="navs">
  <figure class="option" data-choice="wide" onclick="toggleSelect(this)" style="display:block">
    <div class="rail">
      <div class="mark">DRMS<span>Bagong Silang ops</span></div>
      <a class="on"><i data-lucide="radio"></i>Live</a>
      <a><i data-lucide="flame"></i>Fire<span class="t" style="color:#E8806A">Severe</span></a>
      <a><i data-lucide="waves"></i>Flood<span class="t" style="color:#7FB7D9">3/5</span></a>
      <a><i data-lucide="drone"></i>Flight</a>
      <a><i data-lucide="map"></i>Map</a>
      <a class="foot"><i data-lucide="moon"></i>Dark</a>
    </div>
    <figcaption><b>A · Wide (recommended):</b> icon, label and live status on each row, so you can read the state without opening the page.</figcaption>
  </figure>

  <figure class="option" data-choice="slim" onclick="toggleSelect(this)" style="display:block">
    <div class="rail slim">
      <div class="mark">DRMS</div>
      <a class="on"><i data-lucide="radio"></i>Live</a>
      <a><i data-lucide="flame"></i>Fire<span class="dot" style="background:#E8806A"></span></a>
      <a><i data-lucide="waves"></i>Flood<span class="dot" style="background:#7FB7D9"></span></a>
      <a><i data-lucide="drone"></i>Flight</a>
      <a><i data-lucide="map"></i>Map</a>
      <a class="foot"><i data-lucide="moon"></i>Dark</a>
    </div>
    <figcaption><b>B · Slim:</b> same footprint as today's rail (icon above label). Status shrinks to a coloured dot, which gives more room to the page.</figcaption>
  </figure>
</div>
<script>lucide.createIcons();</script>
